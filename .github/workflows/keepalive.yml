# يبقي قاعدة البيانات نشطة: Supabase يوقف المشاريع المجانية بعد أسبوع بلا نشاط.
name: keep-database-awake
on:
  schedule:
    - cron: "17 5 */3 * *"   # كل 3 أيام
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o out.json -w "%{http_code}" -X POST \
              "https://gkwnqvzgadgoeevetndd.supabase.co/rest/v1/rpc/keepalive" \
              -H "apikey: sb_publishable_tLMT413QiGkdB00qWb5CIQ_yO8GOZrb" -H "Content-Type: application/json" -d '{}')
            echo "HTTP $code $(cat out.json)"; [ "$code" = "200" ] && break; sleep 20
          done
          [ "$code" = "200" ]
      # GitHub يعطّل المهام المجدولة في المستودعات الخاملة 60 يومًا؛ هذا السجل يبقيه نشطًا.
      - uses: actions/checkout@v4
      - name: Heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%MZ" > heartbeat.txt
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "heartbeat" && git push || true
